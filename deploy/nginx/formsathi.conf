# FormSathi on Nginx + PHP 8.3-FPM.
# server-setup.sh copies this to /etc/nginx/sites-available/formsathi and
# swaps in your domain. Run `certbot --nginx -d <domain>` afterwards: it adds
# the HTTPS server block and the HTTP -> HTTPS redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name formsathi.example.com;

    # Always the newest release; deploy.sh moves this symlink.
    root /var/www/formsathi/current/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # Papers are up to 10 MB (config/formsathi.php), plus form overhead.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Built assets have content hashes in their names, so they can be cached for good.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        # The app's own PHP-FPM pool (deploy/php/formsathi-pool.conf).
        fastcgi_pass unix:/run/php/formsathi.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Building a job kit waits on the AI for up to a minute or two.
        fastcgi_read_timeout 180s;
        internal;
    }

    # No other PHP file is ever executed.
    location ~ \.php$ {
        return 404;
    }

    # Hidden files (.env, .git) are never served; certbot's challenge folder is.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
}
