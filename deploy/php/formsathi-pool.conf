; PHP-FPM pool for FormSathi, installed to /etc/php/8.3/fpm/pool.d/.
; It runs as the same user as deploys, the queue worker and artisan, so
; files any of them create in storage/ stay readable and writable by all.

[formsathi]
user = formsathi
group = www-data

listen = /run/php/formsathi.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Only the app's own folder and temp space.
php_admin_value[open_basedir] = /var/www/formsathi:/tmp:/usr/share/php
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
