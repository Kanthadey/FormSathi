; FormSathi PHP settings (FPM and CLI). Installed by server-setup.sh.

; Uploads: papers up to 10 MB.
upload_max_filesize = 12M
post_max_size = 14M

; Job kits wait on the AI; Nginx allows 180 s.
max_execution_time = 180
memory_limit = 256M

; Don't advertise the PHP version.
expose_php = Off

; Laravel does its own error pages; never print errors to visitors.
display_errors = Off
log_errors = On

; Code only changes on deploy, and deploy.sh reloads PHP-FPM.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

date.timezone = Asia/Dhaka
